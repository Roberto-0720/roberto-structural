<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 450" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="slab2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#BDC3C7;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#95A5A6;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="soil2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#8B7355;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#6B5B3E;stop-opacity:1"/>
    </linearGradient>
    <marker id="aD2" markerWidth="8" markerHeight="6" refX="4" refY="6" orient="auto">
      <polygon points="0 0, 8 0, 4 6" fill="#E74C3C"/>
    </marker>
  </defs>

  <rect width="780" height="450" rx="12" fill="#1a1a2e"/>
  <text x="390" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#ECF0F1">THREE DESIGN LOAD CASES — Slab on Grade</text>
  <text x="390" y="52" text-anchor="middle" font-size="12" fill="#7F8C8D">Per ACI 360R-06 / PCA IS195 / TM 5-809-12</text>

  <!-- ===== CASE 1: CONCENTRATED ===== -->
  <g transform="translate(20,70)">
    <rect width="235" height="350" rx="10" fill="#16213e" stroke="#E67E22" stroke-width="2"/>
    <rect x="0" y="0" width="235" height="32" rx="10" fill="#E67E22"/>
    <text x="117" y="22" text-anchor="middle" font-size="13" font-weight="bold" fill="white">CASE 1: Concentrated Load</text>

    <!-- Slab -->
    <rect x="20" y="140" width="195" height="25" fill="url(#slab2)" stroke="#555" stroke-width="1.5" rx="2"/>
    <!-- Soil -->
    <rect x="20" y="170" width="195" height="15" fill="url(#soil2)" rx="2" opacity="0.5"/>

    <!-- Forklift wheel loads -->
    <line x1="80" y1="85" x2="80" y2="135" stroke="#E74C3C" stroke-width="2.5" marker-end="url(#aD2)"/>
    <text x="80" y="78" text-anchor="middle" font-size="11" fill="#E74C3C" font-weight="bold">P₁</text>
    <line x1="145" y1="85" x2="145" y2="135" stroke="#E74C3C" stroke-width="2.5" marker-end="url(#aD2)"/>
    <text x="145" y="78" text-anchor="middle" font-size="11" fill="#E74C3C" font-weight="bold">P₂</text>

    <!-- Contact area -->
    <rect x="70" y="137" width="20" height="5" fill="#E67E22" rx="2"/>
    <rect x="135" y="137" width="20" height="5" fill="#E67E22" rx="2"/>
    <text x="112" y="133" text-anchor="middle" font-size="8" fill="#F39C12">Ac</text>

    <!-- Forklift icon simple -->
    <rect x="65" y="55" width="95" height="20" fill="#34495E" stroke="#555" stroke-width="1" rx="3"/>
    <circle cx="80" cy="75" r="5" fill="#555" stroke="#333" stroke-width="1"/>
    <circle cx="145" cy="75" r="5" fill="#555" stroke="#333" stroke-width="1"/>

    <!-- Checks -->
    <text x="25" y="210" font-size="10" fill="#ECF0F1">✅ Flexure (Westergaard)</text>
    <text x="25" y="228" font-size="10" fill="#ECF0F1">✅ Punching Shear</text>
    <text x="25" y="246" font-size="10" fill="#ECF0F1">✅ Bearing</text>
    <text x="25" y="264" font-size="10" fill="#ECF0F1">✅ Dowel Bearing (at joints)</text>

    <!-- Sources -->
    <text x="25" y="295" font-size="9" fill="#7F8C8D">Sources:</text>
    <text x="25" y="310" font-size="9" fill="#3498DB">Westergaard, PCA IS195,</text>
    <text x="25" y="325" font-size="9" fill="#3498DB">ACI 360R-06 Ch.6</text>

    <rect x="20" y="335" width="195" height="8" rx="4" fill="#E67E22" opacity="0.4"/>
  </g>

  <!-- ===== CASE 2: WALL LOAD ===== -->
  <g transform="translate(272,70)">
    <rect width="235" height="350" rx="10" fill="#16213e" stroke="#9B59B6" stroke-width="2"/>
    <rect x="0" y="0" width="235" height="32" rx="10" fill="#9B59B6"/>
    <text x="117" y="22" text-anchor="middle" font-size="13" font-weight="bold" fill="white">CASE 2: Continuous Wall</text>

    <!-- Slab -->
    <rect x="20" y="140" width="195" height="25" fill="url(#slab2)" stroke="#555" stroke-width="1.5" rx="2"/>
    <!-- Soil -->
    <rect x="20" y="170" width="195" height="15" fill="url(#soil2)" rx="2" opacity="0.5"/>

    <!-- Wall on slab -->
    <rect x="95" y="55" width="25" height="85" fill="#7F8C8D" stroke="#555" stroke-width="1.5" rx="1"/>
    <text x="107" y="100" text-anchor="middle" font-size="9" fill="#ECF0F1" font-weight="bold" transform="rotate(-90,107,100)">WALL</text>

    <!-- Line load arrows -->
    <line x1="107" y1="45" x2="107" y2="55" stroke="#E74C3C" stroke-width="2"/>
    <text x="107" y="40" text-anchor="middle" font-size="11" fill="#E74C3C" font-weight="bold">w (kN/m)</text>

    <!-- Beam on elastic foundation diagram -->
    <path d="M 20,167 Q 60,162 107,175 Q 155,162 195,167" fill="none" stroke="#F39C12" stroke-width="2" stroke-dasharray="4,3"/>

    <!-- Checks -->
    <text x="25" y="210" font-size="10" fill="#ECF0F1">✅ Near center/joint</text>
    <text x="25" y="228" font-size="10" fill="#ECF0F1">✅ Near free edge</text>
    <text x="25" y="246" font-size="10" fill="#ECF0F1">Method: Beam on</text>
    <text x="25" y="264" font-size="10" fill="#ECF0F1">Elastic Foundation</text>

    <!-- Sources -->
    <text x="25" y="295" font-size="9" fill="#7F8C8D">Sources:</text>
    <text x="25" y="310" font-size="9" fill="#3498DB">TM 5-809-12 Ch.3,</text>
    <text x="25" y="325" font-size="9" fill="#3498DB">Appendix B (Staab)</text>

    <rect x="20" y="335" width="195" height="8" rx="4" fill="#9B59B6" opacity="0.4"/>
  </g>

  <!-- ===== CASE 3: UNIFORM ===== -->
  <g transform="translate(524,70)">
    <rect width="235" height="350" rx="10" fill="#16213e" stroke="#27AE60" stroke-width="2"/>
    <rect x="0" y="0" width="235" height="32" rx="10" fill="#27AE60"/>
    <text x="117" y="22" text-anchor="middle" font-size="13" font-weight="bold" fill="white">CASE 3: Uniform Load</text>

    <!-- Slab -->
    <rect x="20" y="140" width="195" height="25" fill="url(#slab2)" stroke="#555" stroke-width="1.5" rx="2"/>
    <!-- Soil -->
    <rect x="20" y="170" width="195" height="15" fill="url(#soil2)" rx="2" opacity="0.5"/>

    <!-- Uniform load on left side -->
    <rect x="20" y="80" width="70" height="55" fill="#27AE60" opacity="0.3" stroke="#27AE60" stroke-width="1.5" rx="3"/>
    <text x="55" y="112" text-anchor="middle" font-size="10" fill="#27AE60" font-weight="bold">q (kPa)</text>
    <!-- Load arrows -->
    <line x1="35" y1="75" x2="35" y2="135" stroke="#E74C3C" stroke-width="1.5" marker-end="url(#aD2)"/>
    <line x1="55" y1="75" x2="55" y2="135" stroke="#E74C3C" stroke-width="1.5" marker-end="url(#aD2)"/>
    <line x1="75" y1="75" x2="75" y2="135" stroke="#E74C3C" stroke-width="1.5" marker-end="url(#aD2)"/>

    <!-- Uniform load on right side -->
    <rect x="145" y="80" width="70" height="55" fill="#27AE60" opacity="0.3" stroke="#27AE60" stroke-width="1.5" rx="3"/>
    <text x="180" y="112" text-anchor="middle" font-size="10" fill="#27AE60" font-weight="bold">q (kPa)</text>
    <line x1="160" y1="75" x2="160" y2="135" stroke="#E74C3C" stroke-width="1.5" marker-end="url(#aD2)"/>
    <line x1="180" y1="75" x2="180" y2="135" stroke="#E74C3C" stroke-width="1.5" marker-end="url(#aD2)"/>
    <line x1="200" y1="75" x2="200" y2="135" stroke="#E74C3C" stroke-width="1.5" marker-end="url(#aD2)"/>

    <!-- Aisle width -->
    <line x1="93" y1="95" x2="143" y2="95" stroke="#F1C40F" stroke-width="2"/>
    <line x1="93" y1="90" x2="93" y2="100" stroke="#F1C40F" stroke-width="1.5"/>
    <line x1="143" y1="90" x2="143" y2="100" stroke="#F1C40F" stroke-width="1.5"/>
    <text x="118" y="88" text-anchor="middle" font-size="9" fill="#F1C40F" font-weight="bold">Aisle</text>

    <!-- Checks -->
    <text x="25" y="210" font-size="10" fill="#ECF0F1">✅ Critical aisle width</text>
    <text x="25" y="228" font-size="10" fill="#ECF0F1">✅ Negative bending</text>
    <text x="25" y="246" font-size="10" fill="#ECF0F1">⚠️ Narrow aisle =</text>
    <text x="25" y="264" font-size="10" fill="#F39C12" font-weight="bold">   Maximum stress!</text>

    <!-- Sources -->
    <text x="25" y="295" font-size="9" fill="#7F8C8D">Sources:</text>
    <text x="25" y="310" font-size="9" fill="#3498DB">TM 5-809-12 Ch.3,</text>
    <text x="25" y="325" font-size="9" fill="#3498DB">PCA IS195</text>

    <rect x="20" y="335" width="195" height="8" rx="4" fill="#27AE60" opacity="0.4"/>
  </g>

  <text x="390" y="440" text-anchor="middle" font-size="11" fill="#7F8C8D">Fig. 2 — Three design load cases for slab on grade</text>
</svg>
