<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 420" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="slabG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#BDC3C7;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#95A5A6;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="soilG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#8B7355;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#6B5B3E;stop-opacity:1"/>
    </linearGradient>
    <marker id="arrDown" markerWidth="8" markerHeight="6" refX="4" refY="6" orient="auto">
      <polygon points="0 0, 8 0, 4 6" fill="#E74C3C"/>
    </marker>
    <marker id="arrUp" markerWidth="8" markerHeight="6" refX="4" refY="0" orient="auto">
      <polygon points="0 6, 8 6, 4 0" fill="#27AE60"/>
    </marker>
  </defs>

  <rect width="780" height="420" rx="12" fill="#1a1a2e"/>
  <text x="390" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#ECF0F1">WESTERGAARD — Three Critical Loading Positions</text>

  <!-- ===== INTERIOR ===== -->
  <g transform="translate(20,55)">
    <rect width="230" height="340" rx="10" fill="#16213e" stroke="#27AE60" stroke-width="2"/>
    <text x="115" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#27AE60">① INTERIOR</text>

    <!-- Slab -->
    <rect x="20" y="155" width="190" height="30" fill="url(#slabG)" stroke="#555" stroke-width="1.5" rx="2"/>
    <text x="115" y="174" text-anchor="middle" font-size="10" fill="#2C3E50" font-weight="bold">SLAB</text>

    <!-- Soil/springs -->
    <g opacity="0.7">
      <line x1="40" y1="185" x2="40" y2="220" stroke="#8B7355" stroke-width="1.5"/>
      <path d="M 35,220 L 45,220" stroke="#8B7355" stroke-width="1.5"/>
      <line x1="80" y1="185" x2="80" y2="220" stroke="#8B7355" stroke-width="1.5"/>
      <path d="M 75,220 L 85,220" stroke="#8B7355" stroke-width="1.5"/>
      <line x1="115" y1="185" x2="115" y2="220" stroke="#8B7355" stroke-width="1.5"/>
      <path d="M 110,220 L 120,220" stroke="#8B7355" stroke-width="1.5"/>
      <line x1="150" y1="185" x2="150" y2="220" stroke="#8B7355" stroke-width="1.5"/>
      <path d="M 145,220 L 155,220" stroke="#8B7355" stroke-width="1.5"/>
      <line x1="185" y1="185" x2="185" y2="220" stroke="#8B7355" stroke-width="1.5"/>
      <path d="M 180,220 L 190,220" stroke="#8B7355" stroke-width="1.5"/>
    </g>
    <rect x="20" y="225" width="190" height="20" fill="url(#soilG)" rx="2" opacity="0.6"/>
    <text x="115" y="239" text-anchor="middle" font-size="9" fill="#D4C5A0">SUBGRADE (k)</text>

    <!-- Load arrow (center) -->
    <line x1="115" y1="65" x2="115" y2="150" stroke="#E74C3C" stroke-width="3" marker-end="url(#arrDown)"/>
    <text x="115" y="58" text-anchor="middle" font-size="13" fill="#E74C3C" font-weight="bold">P</text>

    <!-- Stress diagram at bottom -->
    <path d="M 50,185 Q 80,200 115,205 Q 150,200 180,185" fill="none" stroke="#F39C12" stroke-width="2" stroke-dasharray="4,3"/>
    <text x="115" y="215" text-anchor="middle" font-size="9" fill="#F39C12" font-weight="bold">σ max</text>

    <!-- Description -->
    <text x="115" y="268" text-anchor="middle" font-size="10" fill="#ECF0F1">Load far from edges</text>
    <text x="115" y="284" text-anchor="middle" font-size="10" fill="#ECF0F1">Max tension at</text>
    <text x="115" y="298" text-anchor="middle" font-size="10" fill="#E74C3C" font-weight="bold">BOTTOM of slab</text>
    <rect x="25" y="310" width="180" height="22" rx="4" fill="#27AE60" opacity="0.2"/>
    <text x="115" y="325" text-anchor="middle" font-size="10" fill="#27AE60" font-weight="bold">Most common case</text>
  </g>

  <!-- ===== EDGE ===== -->
  <g transform="translate(270,55)">
    <rect width="230" height="340" rx="10" fill="#16213e" stroke="#3498DB" stroke-width="2"/>
    <text x="115" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#3498DB">② EDGE</text>

    <!-- Slab (half, showing edge) -->
    <rect x="20" y="155" width="140" height="30" fill="url(#slabG)" stroke="#555" stroke-width="1.5" rx="2"/>
    <text x="90" y="174" text-anchor="middle" font-size="10" fill="#2C3E50" font-weight="bold">SLAB</text>
    <!-- Free edge mark -->
    <line x1="160" y1="150" x2="160" y2="190" stroke="#E74C3C" stroke-width="2.5" stroke-dasharray="5,3"/>
    <text x="185" y="175" font-size="9" fill="#E74C3C" font-weight="bold">Free</text>
    <text x="185" y="186" font-size="9" fill="#E74C3C" font-weight="bold">Edge</text>

    <!-- Soil/springs (only under slab) -->
    <g opacity="0.7">
      <line x1="40" y1="185" x2="40" y2="220" stroke="#8B7355" stroke-width="1.5"/>
      <path d="M 35,220 L 45,220" stroke="#8B7355" stroke-width="1.5"/>
      <line x1="75" y1="185" x2="75" y2="220" stroke="#8B7355" stroke-width="1.5"/>
      <path d="M 70,220 L 80,220" stroke="#8B7355" stroke-width="1.5"/>
      <line x1="110" y1="185" x2="110" y2="220" stroke="#8B7355" stroke-width="1.5"/>
      <path d="M 105,220 L 115,220" stroke="#8B7355" stroke-width="1.5"/>
      <line x1="145" y1="185" x2="145" y2="220" stroke="#8B7355" stroke-width="1.5"/>
      <path d="M 140,220 L 150,220" stroke="#8B7355" stroke-width="1.5"/>
    </g>
    <rect x="20" y="225" width="140" height="20" fill="url(#soilG)" rx="2" opacity="0.6"/>

    <!-- Load arrow (at edge) -->
    <line x1="155" y1="65" x2="155" y2="150" stroke="#E74C3C" stroke-width="3" marker-end="url(#arrDown)"/>
    <text x="155" y="58" text-anchor="middle" font-size="13" fill="#E74C3C" font-weight="bold">P</text>

    <!-- Description -->
    <text x="115" y="268" text-anchor="middle" font-size="10" fill="#ECF0F1">Load at slab edge</text>
    <text x="115" y="284" text-anchor="middle" font-size="10" fill="#ECF0F1">Max tension at</text>
    <text x="115" y="298" text-anchor="middle" font-size="10" fill="#E74C3C" font-weight="bold">BOTTOM of slab</text>
    <rect x="25" y="310" width="180" height="22" rx="4" fill="#E74C3C" opacity="0.2"/>
    <text x="115" y="325" text-anchor="middle" font-size="10" fill="#E74C3C" font-weight="bold">Higher stress than Interior!</text>
  </g>

  <!-- ===== CORNER ===== -->
  <g transform="translate(520,55)">
    <rect width="240" height="340" rx="10" fill="#16213e" stroke="#F39C12" stroke-width="2"/>
    <text x="120" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#F39C12">③ CORNER</text>

    <!-- Slab (corner piece) -->
    <polygon points="20,155 130,155 130,185 20,185" fill="url(#slabG)" stroke="#555" stroke-width="1.5"/>
    <text x="75" y="174" text-anchor="middle" font-size="10" fill="#2C3E50" font-weight="bold">SLAB</text>
    <!-- Free edges -->
    <line x1="130" y1="150" x2="130" y2="190" stroke="#E74C3C" stroke-width="2.5" stroke-dasharray="5,3"/>
    <line x1="15" y1="185" x2="135" y2="185" stroke="#E74C3C" stroke-width="0" stroke-dasharray="5,3"/>

    <!-- Soil/springs -->
    <g opacity="0.7">
      <line x1="40" y1="185" x2="40" y2="220" stroke="#8B7355" stroke-width="1.5"/>
      <path d="M 35,220 L 45,220" stroke="#8B7355" stroke-width="1.5"/>
      <line x1="75" y1="185" x2="75" y2="220" stroke="#8B7355" stroke-width="1.5"/>
      <path d="M 70,220 L 80,220" stroke="#8B7355" stroke-width="1.5"/>
      <line x1="110" y1="185" x2="110" y2="220" stroke="#8B7355" stroke-width="1.5"/>
      <path d="M 105,220 L 115,220" stroke="#8B7355" stroke-width="1.5"/>
    </g>
    <rect x="20" y="225" width="110" height="20" fill="url(#soilG)" rx="2" opacity="0.6"/>

    <!-- Load arrow (at corner) -->
    <line x1="125" y1="65" x2="125" y2="150" stroke="#E74C3C" stroke-width="3" marker-end="url(#arrDown)"/>
    <text x="125" y="58" text-anchor="middle" font-size="13" fill="#E74C3C" font-weight="bold">P</text>

    <!-- Stress at TOP -->
    <path d="M 80,155 Q 100,140 125,135" fill="none" stroke="#F39C12" stroke-width="2" stroke-dasharray="4,3"/>
    <text x="160" y="140" font-size="9" fill="#F39C12" font-weight="bold">σ max</text>

    <!-- Description -->
    <text x="120" y="268" text-anchor="middle" font-size="10" fill="#ECF0F1">Load at slab corner</text>
    <text x="120" y="284" text-anchor="middle" font-size="10" fill="#ECF0F1">Max tension at</text>
    <text x="120" y="298" text-anchor="middle" font-size="10" fill="#F39C12" font-weight="bold">TOP of slab ⚠️</text>
    <rect x="30" y="310" width="180" height="22" rx="4" fill="#F39C12" opacity="0.2"/>
    <text x="120" y="325" text-anchor="middle" font-size="10" fill="#F39C12" font-weight="bold">Different failure mode!</text>
  </g>

  <text x="390" y="412" text-anchor="middle" font-size="11" fill="#7F8C8D">Fig. 1 — Three critical loading positions per Westergaard theory</text>
</svg>
