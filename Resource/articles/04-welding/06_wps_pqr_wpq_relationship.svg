<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 420" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <marker id="arrW" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ECF0F1"/>
    </marker>
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect width="750" height="420" rx="12" fill="#1a1a2e"/>
  <text x="375" y="35" text-anchor="middle" font-size="18" font-weight="bold" fill="#ECF0F1">WPS — PQR — WPQ: Mối quan hệ ba bên</text>

  <!-- WPS Box (Center top) -->
  <rect x="260" y="60" width="230" height="100" rx="12" fill="#16213e" stroke="#3498DB" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="375" y="90" text-anchor="middle" font-size="20" font-weight="bold" fill="#3498DB">📋 WPS</text>
  <text x="375" y="112" text-anchor="middle" font-size="12" fill="#ECF0F1">Welding Procedure Specification</text>
  <text x="375" y="130" text-anchor="middle" font-size="11" fill="#7F8C8D">"Công thức nấu ăn" — Hướng dẫn cách hàn</text>
  <text x="375" y="150" text-anchor="middle" font-size="10" fill="#F39C12">Quy trình, thông số, vật liệu, vị trí...</text>

  <!-- PQR Box (Bottom left) -->
  <rect x="40" y="260" width="230" height="120" rx="12" fill="#16213e" stroke="#E74C3C" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="155" y="295" text-anchor="middle" font-size="20" font-weight="bold" fill="#E74C3C">🧪 PQR</text>
  <text x="155" y="317" text-anchor="middle" font-size="12" fill="#ECF0F1">Procedure Qualification Record</text>
  <text x="155" y="335" text-anchor="middle" font-size="11" fill="#7F8C8D">"Bài kiểm tra" — Chứng minh</text>
  <text x="155" y="350" text-anchor="middle" font-size="11" fill="#7F8C8D">WPS hoạt động đúng</text>
  <text x="155" y="370" text-anchor="middle" font-size="10" fill="#F39C12">Thử uốn, kéo, macro, impact...</text>

  <!-- WPQ Box (Bottom right) -->
  <rect x="480" y="260" width="230" height="120" rx="12" fill="#16213e" stroke="#27AE60" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="595" y="295" text-anchor="middle" font-size="20" font-weight="bold" fill="#27AE60">👨‍🏭 WPQ</text>
  <text x="595" y="317" text-anchor="middle" font-size="12" fill="#ECF0F1">Welder Performance Qualification</text>
  <text x="595" y="335" text-anchor="middle" font-size="11" fill="#7F8C8D">"Bằng lái" — Chứng nhận</text>
  <text x="595" y="350" text-anchor="middle" font-size="11" fill="#7F8C8D">thợ hàn đủ năng lực</text>
  <text x="595" y="370" text-anchor="middle" font-size="10" fill="#F39C12">Thử theo vị trí, chiều dày, quy trình</text>

  <!-- Arrow: WPS → PQR (supports/validates) -->
  <line x1="310" y1="160" x2="195" y2="255" stroke="#ECF0F1" stroke-width="2" marker-end="url(#arrW)"/>
  <rect x="170" y="195" width="110" height="35" rx="6" fill="#E74C3C" opacity="0.2" stroke="#E74C3C" stroke-width="1"/>
  <text x="225" y="210" text-anchor="middle" font-size="10" fill="#E74C3C" font-weight="bold">Được xác nhận</text>
  <text x="225" y="224" text-anchor="middle" font-size="10" fill="#E74C3C" font-weight="bold">bởi PQR</text>

  <!-- Arrow: WPS → WPQ (used by) -->
  <line x1="440" y1="160" x2="555" y2="255" stroke="#ECF0F1" stroke-width="2" marker-end="url(#arrW)"/>
  <rect x="470" y="195" width="110" height="35" rx="6" fill="#27AE60" opacity="0.2" stroke="#27AE60" stroke-width="1"/>
  <text x="525" y="210" text-anchor="middle" font-size="10" fill="#27AE60" font-weight="bold">Thợ hàn thực hiện</text>
  <text x="525" y="224" text-anchor="middle" font-size="10" fill="#27AE60" font-weight="bold">theo WPS</text>

  <!-- Arrow: PQR ↔ WPQ -->
  <line x1="275" y1="320" x2="475" y2="320" stroke="#ECF0F1" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="375" y="315" text-anchor="middle" font-size="10" fill="#7F8C8D">Độc lập nhưng bổ sung cho nhau</text>

  <!-- Prequalified Note -->
  <rect x="300" y="395" width="150" height="22" rx="6" fill="#F39C12" opacity="0.15" stroke="#F39C12" stroke-width="1.5"/>
  <text x="375" y="410" text-anchor="middle" font-size="10" fill="#F39C12" font-weight="bold">⚡ Prequalified WPS</text>

  <!-- Arrow from Prequalified to WPS -->
  <line x1="375" y1="395" x2="375" y2="165" stroke="#F39C12" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="400" y="388" font-size="9" fill="#F39C12">Bỏ qua PQR nếu đủ 5 điều kiện</text>

  <text x="375" y="418" text-anchor="middle" font-size="11" fill="#555">Hình 6 — Mối quan hệ WPS – PQR – WPQ trong hệ thống quản lý chất lượng hàn</text>
</svg>
