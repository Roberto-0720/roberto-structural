<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 440" font-family="'Segoe UI', Arial, sans-serif">
  <rect width="780" height="440" rx="12" fill="#1a1a2e"/>
  <text x="390" y="35" text-anchor="middle" font-size="18" font-weight="bold" fill="#ECF0F1">BASIC WELD SYMBOLS — Ký hiệu cơ bản các loại hàn</text>
  <text x="390" y="55" text-anchor="middle" font-size="12" fill="#7F8C8D">Theo AWS A2.4-2007</text>

  <!-- Row 1: Fillet, Square, V, Bevel -->
  <!-- Fillet -->
  <g transform="translate(40,80)">
    <rect width="155" height="130" rx="8" fill="#16213e" stroke="#E67E22" stroke-width="1.5"/>
    <text x="77" y="25" text-anchor="middle" font-size="13" fill="#E67E22" font-weight="bold">Fillet</text>
    <text x="77" y="40" text-anchor="middle" font-size="10" fill="#7F8C8D">Hàn góc</text>
    <!-- Symbol: right triangle -->
    <line x1="40" y1="110" x2="115" y2="110" stroke="#ECF0F1" stroke-width="2"/>
    <polygon points="55,110 55,70 95,110" fill="none" stroke="#E67E22" stroke-width="3"/>
  </g>

  <!-- Square Groove -->
  <g transform="translate(215,80)">
    <rect width="155" height="130" rx="8" fill="#16213e" stroke="#3498DB" stroke-width="1.5"/>
    <text x="77" y="25" text-anchor="middle" font-size="13" fill="#3498DB" font-weight="bold">Square</text>
    <text x="77" y="40" text-anchor="middle" font-size="10" fill="#7F8C8D">Rãnh vuông</text>
    <line x1="40" y1="110" x2="115" y2="110" stroke="#ECF0F1" stroke-width="2"/>
    <line x1="65" y1="110" x2="65" y2="65" stroke="#3498DB" stroke-width="3"/>
    <line x1="90" y1="110" x2="90" y2="65" stroke="#3498DB" stroke-width="3"/>
  </g>

  <!-- V Groove -->
  <g transform="translate(390,80)">
    <rect width="155" height="130" rx="8" fill="#16213e" stroke="#27AE60" stroke-width="1.5"/>
    <text x="77" y="25" text-anchor="middle" font-size="13" fill="#27AE60" font-weight="bold">V-Groove</text>
    <text x="77" y="40" text-anchor="middle" font-size="10" fill="#7F8C8D">Rãnh chữ V</text>
    <line x1="40" y1="110" x2="115" y2="110" stroke="#ECF0F1" stroke-width="2"/>
    <polyline points="55,65 77,110 100,65" fill="none" stroke="#27AE60" stroke-width="3"/>
  </g>

  <!-- Bevel -->
  <g transform="translate(565,80)">
    <rect width="155" height="130" rx="8" fill="#16213e" stroke="#9B59B6" stroke-width="1.5"/>
    <text x="77" y="25" text-anchor="middle" font-size="13" fill="#9B59B6" font-weight="bold">Bevel</text>
    <text x="77" y="40" text-anchor="middle" font-size="10" fill="#7F8C8D">Vát 1 phía</text>
    <line x1="40" y1="110" x2="115" y2="110" stroke="#ECF0F1" stroke-width="2"/>
    <line x1="80" y1="110" x2="80" y2="65" stroke="#9B59B6" stroke-width="3"/>
    <line x1="55" y1="65" x2="80" y2="110" stroke="#9B59B6" stroke-width="3"/>
  </g>

  <!-- Row 2: U, J, Flare-V, Flare-Bevel -->
  <!-- U Groove -->
  <g transform="translate(40,230)">
    <rect width="155" height="130" rx="8" fill="#16213e" stroke="#E74C3C" stroke-width="1.5"/>
    <text x="77" y="25" text-anchor="middle" font-size="13" fill="#E74C3C" font-weight="bold">U-Groove</text>
    <text x="77" y="40" text-anchor="middle" font-size="10" fill="#7F8C8D">Rãnh chữ U</text>
    <line x1="40" y1="110" x2="115" y2="110" stroke="#ECF0F1" stroke-width="2"/>
    <path d="M 55,65 L 62,95 Q 77,115 92,95 L 100,65" fill="none" stroke="#E74C3C" stroke-width="3"/>
  </g>

  <!-- J Groove -->
  <g transform="translate(215,230)">
    <rect width="155" height="130" rx="8" fill="#16213e" stroke="#F39C12" stroke-width="1.5"/>
    <text x="77" y="25" text-anchor="middle" font-size="13" fill="#F39C12" font-weight="bold">J-Groove</text>
    <text x="77" y="40" text-anchor="middle" font-size="10" fill="#7F8C8D">Rãnh chữ J</text>
    <line x1="40" y1="110" x2="115" y2="110" stroke="#ECF0F1" stroke-width="2"/>
    <line x1="85" y1="65" x2="85" y2="110" stroke="#F39C12" stroke-width="3"/>
    <path d="M 55,65 L 62,95 Q 77,115 85,95" fill="none" stroke="#F39C12" stroke-width="3"/>
  </g>

  <!-- Plug -->
  <g transform="translate(390,230)">
    <rect width="155" height="130" rx="8" fill="#16213e" stroke="#1ABC9C" stroke-width="1.5"/>
    <text x="77" y="25" text-anchor="middle" font-size="13" fill="#1ABC9C" font-weight="bold">Plug / Slot</text>
    <text x="77" y="40" text-anchor="middle" font-size="10" fill="#7F8C8D">Hàn nút / rãnh</text>
    <line x1="40" y1="110" x2="115" y2="110" stroke="#ECF0F1" stroke-width="2"/>
    <!-- Plug symbol: rectangle -->
    <rect x="57" y="70" width="40" height="35" fill="none" stroke="#1ABC9C" stroke-width="3" rx="0"/>
  </g>

  <!-- Surfacing -->
  <g transform="translate(565,230)">
    <rect width="155" height="130" rx="8" fill="#16213e" stroke="#2ECC71" stroke-width="1.5"/>
    <text x="77" y="25" text-anchor="middle" font-size="13" fill="#2ECC71" font-weight="bold">Surfacing</text>
    <text x="77" y="40" text-anchor="middle" font-size="10" fill="#7F8C8D">Hàn đắp bề mặt</text>
    <line x1="40" y1="110" x2="115" y2="110" stroke="#ECF0F1" stroke-width="2"/>
    <!-- Surfacing: semicircle -->
    <path d="M 50,100 Q 77,60 105,100" fill="none" stroke="#2ECC71" stroke-width="3"/>
  </g>

  <!-- Legend -->
  <rect x="40" y="380" width="700" height="40" rx="8" fill="#16213e" stroke="#555" stroke-width="1"/>
  <text x="60" y="405" font-size="12" fill="#ECF0F1">💡 <tspan font-weight="bold">Ghi nhớ:</tspan> Ký hiệu đặt <tspan fill="#E67E22" font-weight="bold">DƯỚI</tspan> ref. line = Arrow Side | Đặt <tspan fill="#3498DB" font-weight="bold">TRÊN</tspan> ref. line = Other Side | Đặt <tspan fill="#27AE60" font-weight="bold">CẢ HAI</tspan> = Both Sides</text>

  <text x="390" y="435" text-anchor="middle" font-size="11" fill="#7F8C8D">Hình 4 — Bảng ký hiệu cơ bản các loại hàn (Basic Weld Symbols)</text>
</svg>
