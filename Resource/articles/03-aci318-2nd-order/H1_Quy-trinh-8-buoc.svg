<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 862" width="900" height="862">
  <style>
    text { font-family: 'Segoe UI','DejaVu Sans',Arial,sans-serif; }
    .h1 { font-size:20px; font-weight:bold; fill:#1B3A5C; }
    .sub { font-size:12.5px; fill:#5A6B7C; }
    .band { font-size:13px; font-weight:bold; fill:#2E6DA4; letter-spacing:1px; }
    .bt { font-size:14.5px; font-weight:bold; fill:#1B3A5C; }
    .bd { font-size:12.5px; fill:#4A5C6B; }
    .badge { font-size:13px; font-weight:bold; fill:#FFFFFF; }
    .foot { font-size:11.5px; fill:#5A6B7C; }
  </style>
  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#2E6DA4"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="862" fill="#FFFFFF"/>
  <text class="h1" x="450" y="34" text-anchor="middle">QUY TRÌNH 8 BƯỚC — THIẾT KẾ BTCT BẬC HAI THEO ACI 318 TRONG SAP2000</text>
  <text class="sub" x="450" y="58" text-anchor="middle">Roberto Structural · Đường phân tích đàn hồi bậc hai theo ACI 318-14 §6.7</text>

  <!-- PHASE BANDS -->
  <rect x="30" y="90" width="110" height="222" rx="6" fill="#EAF1F8" stroke="#B9D0E5"/>
  <text class="band" transform="rotate(-90 85 201)" x="85" y="206" text-anchor="middle">A · MÔ HÌNH</text>

  <rect x="30" y="330" width="110" height="142" rx="6" fill="#DCE9F5" stroke="#B9D0E5"/>
  <text class="band" transform="rotate(-90 85 401)" x="85" y="406" text-anchor="middle">B · PHÂN TÍCH</text>

  <rect x="30" y="490" width="110" height="302" rx="6" fill="#EAF1F8" stroke="#B9D0E5"/>
  <text class="band" transform="rotate(-90 85 641)" x="85" y="646" text-anchor="middle">C · THIẾT KẾ &amp; KIỂM TRA</text>

  <!-- ARROWS between boxes -->
  <line x1="515" y1="152" x2="515" y2="168" stroke="#2E6DA4" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="515" y1="232" x2="515" y2="248" stroke="#2E6DA4" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="515" y1="312" x2="515" y2="328" stroke="#2E6DA4" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="515" y1="392" x2="515" y2="408" stroke="#2E6DA4" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="515" y1="472" x2="515" y2="488" stroke="#2E6DA4" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="515" y1="552" x2="515" y2="568" stroke="#2E6DA4" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="515" y1="632" x2="515" y2="648" stroke="#2E6DA4" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="515" y1="712" x2="515" y2="728" stroke="#2E6DA4" stroke-width="2" marker-end="url(#ar)"/>

  <!-- BOX 0 -->
  <rect x="165" y="90" width="700" height="62" rx="6" fill="#FFFFFF" stroke="#B9D0E5" stroke-width="1.4"/>
  <rect x="165" y="90" width="5" height="62" rx="2" fill="#2E6DA4"/>
  <circle cx="200" cy="121" r="18" fill="#1B3A5C"/>
  <text class="badge" x="200" y="126" text-anchor="middle">0</text>
  <text class="bt" x="232" y="116">Vùng cứng — End (Length) Offsets</text>
  <text class="bd" x="232" y="136">Automatic from Connectivity · Rigid Zone Factor = 0.5 (mặc định của SAP2000 là 0)</text>

  <!-- BOX 1 -->
  <rect x="165" y="170" width="700" height="62" rx="6" fill="#FFFFFF" stroke="#B9D0E5" stroke-width="1.4"/>
  <rect x="165" y="170" width="5" height="62" rx="2" fill="#2E6DA4"/>
  <circle cx="200" cy="201" r="18" fill="#1B3A5C"/>
  <text class="badge" x="200" y="206" text-anchor="middle">1</text>
  <text class="bt" x="232" y="196">Kiểu thiết kế RC — Design Type</text>
  <text class="bd" x="232" y="216">Beam (M3) cho dầm · Column (P-M2-M3) cho cột · Cover khai là tới TÂM cốt thép</text>

  <!-- BOX 1-1 -->
  <rect x="165" y="250" width="700" height="62" rx="6" fill="#FFFFFF" stroke="#B9D0E5" stroke-width="1.4"/>
  <rect x="165" y="250" width="5" height="62" rx="2" fill="#2E6DA4"/>
  <circle cx="200" cy="281" r="18" fill="#1B3A5C"/>
  <text class="badge" x="200" y="286" text-anchor="middle">1-1</text>
  <text class="bt" x="232" y="276">Suy giảm độ cứng — Property Modifiers</text>
  <text class="bd" x="232" y="296">Cột 0.70 · Dầm 0.35 · Dầm T 0.70 · Xoắn J 0.1–0.2 · Mass &amp; Weight giữ 1.0</text>

  <!-- BOX 2 -->
  <rect x="165" y="330" width="700" height="62" rx="6" fill="#FFFFFF" stroke="#B9D0E5" stroke-width="1.4"/>
  <rect x="165" y="330" width="5" height="62" rx="2" fill="#1B3A5C"/>
  <circle cx="200" cy="361" r="18" fill="#1B3A5C"/>
  <text class="badge" x="200" y="366" text-anchor="middle">2</text>
  <text class="bt" x="232" y="356">Phân tích đàn hồi bậc hai</text>
  <text class="bd" x="232" y="376">Copy bộ tổ hợp “L-” TRƯỚC → Convert to Nonlinear (P-Delta) → Auto Mesh ≥ 2 đoạn</text>
  <polygon points="840,352 833,366 847,366" fill="#D97D0D"/>

  <!-- BOX 2-1 -->
  <rect x="165" y="410" width="700" height="62" rx="6" fill="#FFFFFF" stroke="#B9D0E5" stroke-width="1.4"/>
  <rect x="165" y="410" width="5" height="62" rx="2" fill="#1B3A5C"/>
  <circle cx="200" cy="441" r="18" fill="#1B3A5C"/>
  <text class="badge" x="200" y="446" text-anchor="middle">2-1</text>
  <text class="bt" x="232" y="436">Khai báo cho thiết kế động đất</text>
  <text class="bd" x="232" y="456">Design Load Type = Quake + cặp gravity case Dead / Other với hệ số +1 / −1</text>

  <!-- BOX 3 -->
  <rect x="165" y="490" width="700" height="62" rx="6" fill="#FFFFFF" stroke="#B9D0E5" stroke-width="1.4"/>
  <rect x="165" y="490" width="5" height="62" rx="2" fill="#2E6DA4"/>
  <circle cx="200" cy="521" r="18" fill="#1B3A5C"/>
  <text class="badge" x="200" y="526" text-anchor="middle">3</text>
  <text class="bt" x="232" y="516">Tham số thiết kế — Preferences &amp; Overwrites</text>
  <text class="bd" x="232" y="536">Design Combos = bộ bậc hai · BỎ tích Auto-Generate Combos · Dns = Ds = 1.0</text>
  <polygon points="840,512 833,526 847,526" fill="#D97D0D"/>

  <!-- BOX 4 -->
  <rect x="165" y="570" width="700" height="62" rx="6" fill="#FFFFFF" stroke="#B9D0E5" stroke-width="1.4"/>
  <rect x="165" y="570" width="5" height="62" rx="2" fill="#2E6DA4"/>
  <circle cx="200" cy="601" r="18" fill="#1B3A5C"/>
  <text class="badge" x="200" y="606" text-anchor="middle">4</text>
  <text class="bt" x="232" y="596">Kiểm tra ổn định tổng thể</text>
  <text class="bd" x="232" y="616">M(bậc 2) / M(bậc 1) ≤ 1.4 — ACI 318-14 §6.2.6, là yêu cầu BẮT BUỘC của code</text>
  <polygon points="840,592 833,606 847,606" fill="#D97D0D"/>

  <!-- BOX 5 -->
  <rect x="165" y="650" width="700" height="62" rx="6" fill="#FFFFFF" stroke="#B9D0E5" stroke-width="1.4"/>
  <rect x="165" y="650" width="5" height="62" rx="2" fill="#2E6DA4"/>
  <circle cx="200" cy="681" r="18" fill="#1B3A5C"/>
  <text class="badge" x="200" y="686" text-anchor="middle">5</text>
  <text class="bt" x="232" y="676">Thiết kế cấu kiện — vòng lặp 2 lượt</text>
  <text class="bd" x="232" y="696">Lượt 1: As yêu cầu → nhập thép THẬT → Lượt 2: Ve, joint shear, tỷ số 6/5</text>

  <!-- BOX 6 -->
  <rect x="165" y="730" width="700" height="62" rx="6" fill="#FFFFFF" stroke="#B9D0E5" stroke-width="1.4"/>
  <rect x="165" y="730" width="5" height="62" rx="2" fill="#2E6DA4"/>
  <circle cx="200" cy="761" r="18" fill="#1B3A5C"/>
  <text class="badge" x="200" y="766" text-anchor="middle">6</text>
  <text class="bt" x="232" y="756">Kiểm tra điều kiện sử dụng</text>
  <text class="bd" x="232" y="776">File mô hình riêng, modifier ×1.4 (≤ Ig) · Drift động đất vẫn dùng tiết diện nứt</text>

  <!-- FOOTER -->
  <polygon points="172,820 165,834 179,834" fill="#D97D0D"/>
  <text class="foot" x="188" y="833">Ba lỗi phổ biến nhất: convert trước khi copy tổ hợp · quên đặt Dns = Ds = 1.0 · coi kiểm tra 1.4 là tùy chọn</text>
</svg>
