  <text
     class="bd"
     x="58"
     y="626"
     id="text43">Hai case giống hệt nhau với hệ số +1 và −1 → triệt tiêu hoàn toàn, nội lực tổ hợp KHÔNG đổi một chút nào.</text>
  <text
     class="bd"
     x="58"
     y="644"
     id="text44">Nhưng SAP2000 đọc case mang nhãn “Dead” để lấy Vg. Bỏ bước này, Vₑ chỉ còn phần từ Mpr — thiếu hẳn phần tải</text>
  <text
