<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 60 900 326" width="900" height="326" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#14314F"/>
    </marker>
    <marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#E8842A"/>
    </marker>
    <marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1F6FB2"/>
    </marker>
  </defs>

  <rect x="0" y="60" width="900" height="326" fill="#FFFFFF"/>
  
  

  <text x="28" y="88" font-size="12" font-weight="bold" fill="#6B7A88">NATURE OF THE PROBLEM</text>

  <g stroke="#14314F" stroke-width="1.4" fill="#FFFFFF">
    <rect x="26" y="100" width="212" height="58" rx="5"/>
    <rect x="26" y="176" width="212" height="58" rx="5"/>
    <rect x="26" y="252" width="212" height="70" rx="5"/>
  </g>
  <g font-size="12.5" fill="#14314F">
    <text x="40" y="122" font-weight="bold">1. Second-order effects</text>
    <text x="40" y="142">P-Δ (nodal) and P-δ (member)</text>
    <text x="40" y="198" font-weight="bold">2. Initial geometric imperfection</text>
    <text x="40" y="218">Erection out-of-plumbness: 1/500</text>
    <text x="40" y="274" font-weight="bold">3. Stiffness reduction</text>
    <text x="40" y="294">Distributed yielding, residual</text>
    <text x="40" y="311">stresses, early inelasticity</text>
  </g>

  <path d="M 238 129 L 262 129 L 262 152 L 290 152" fill="none" stroke="#E8842A" stroke-width="1.6" marker-end="url(#aro)"/>
  <path d="M 238 205 L 262 205" fill="none" stroke="#6B7A88" stroke-width="1.2"/>
  <path d="M 262 129 L 262 300" fill="none" stroke="#6B7A88" stroke-width="1.2" stroke-dasharray="3 3"/>
  <path d="M 262 300 L 290 300" fill="none" stroke="#1F6FB2" stroke-width="1.6" marker-end="url(#arb)"/>

  <rect x="292" y="96" width="336" height="112" rx="6" fill="#FDF2E6" stroke="#E8842A" stroke-width="1.6"/>
  <text x="308" y="120" font-size="14" font-weight="bold" fill="#B35C00">ELM — Effective Length Method</text>
  <g font-size="12.5" fill="#14314F">
    <text x="308" y="145">All three effects lumped into one factor: K</text>
    <text x="308" y="166">Alignment charts, built on many assumptions</text>
    <text x="308" y="187">Real industrial frames rarely satisfy them</text>
  </g>
  <path d="M 628 152 L 662 152" fill="none" stroke="#E8842A" stroke-width="1.8" marker-end="url(#aro)"/>
  <rect x="664" y="96" width="210" height="112" rx="6" fill="#FFFFFF" stroke="#C0392B" stroke-width="1.6"/>
  <text x="769" y="140" font-size="24" font-weight="bold" fill="#C0392B" text-anchor="middle">K ≠ 1.0</text>
  <text x="769" y="166" font-size="12" fill="#14314F" text-anchor="middle">An unverifiable number, hard</text>
  <text x="769" y="184" font-size="12" fill="#14314F" text-anchor="middle">to defend under design review</text>

  <rect x="292" y="238" width="336" height="132" rx="6" fill="#F2F6FA" stroke="#1F6FB2" stroke-width="1.6"/>
  <text x="308" y="262" font-size="14" font-weight="bold" fill="#12558F">DAM — Direct Analysis Method</text>
  <g font-size="12.5" fill="#14314F">
    <text x="308" y="288">1  Second-order analysis: Nonlinear + P-Delta</text>
    <text x="308" y="311">2  Notional loads: Ni = 0.002 · α · Yi</text>
    <text x="308" y="334">3  Reduced stiffness: EA* = 0.8EA ; EI* = 0.8 τb EI</text>
    <text x="308" y="357" fill="#6B7A88">The model carries the difficulty, not the engineer</text>
  </g>
  <path d="M 628 304 L 662 304" fill="none" stroke="#1F6FB2" stroke-width="1.8" marker-end="url(#arb)"/>
  <rect x="664" y="238" width="210" height="132" rx="6" fill="#FFFFFF" stroke="#1E8449" stroke-width="1.8"/>
  <text x="769" y="288" font-size="26" font-weight="bold" fill="#1E8449" text-anchor="middle">K = 1.0</text>
  <text x="769" y="314" font-size="12" fill="#14314F" text-anchor="middle">Members checked with their</text>
  <text x="769" y="332" font-size="12" fill="#14314F" text-anchor="middle">actual length L — every</text>
  <text x="769" y="350" font-size="12" fill="#14314F" text-anchor="middle">assumption sits in the model</text>

  
</svg>
