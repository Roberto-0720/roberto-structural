<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 58 900 376" width="900" height="376" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="d-aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#E8842A"/>
    </marker>
    <marker id="d-arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1F6FB2"/>
    </marker>
    <marker id="d-arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6B7A88"/>
    </marker>
  </defs>
  <rect x="0" y="58" width="900" height="376" fill="#FFFFFF"/>

  
  

  <!-- ===== PANEL A ===== -->
  <rect x="28" y="74" width="404" height="290" rx="6" fill="#FDF2E6" stroke="#E8842A" stroke-width="1.5"/>
  <text x="48" y="100" font-size="14" font-weight="bold" fill="#B35C00">A. Tổ hợp CHỈ có tải đứng</text>
  <text x="48" y="120" font-size="12" fill="#14314F">Chưa biết chiều nào bất lợi → phải xét cả 4 chiều</text>

  <rect x="160" y="170" width="140" height="120" fill="#FFFFFF" stroke="#14314F" stroke-width="1.6"/>
  <text x="230" y="236" font-size="12" fill="#6B7A88" text-anchor="middle">MẶT BẰNG</text>
  <line x1="308" y1="230" x2="368" y2="230" stroke="#E8842A" stroke-width="3" marker-end="url(#d-aro)"/>
  <text x="374" y="234" font-size="12.5" font-weight="bold" fill="#B35C00">+X</text>
  <line x1="152" y1="230" x2="92" y2="230" stroke="#E8842A" stroke-width="3" marker-end="url(#d-aro)"/>
  <text x="62" y="234" font-size="12.5" font-weight="bold" fill="#B35C00">−X</text>
  <line x1="230" y1="162" x2="230" y2="140" stroke="#E8842A" stroke-width="3" marker-end="url(#d-aro)"/>
  <text x="238" y="148" font-size="12.5" font-weight="bold" fill="#B35C00">+Y</text>
  <line x1="230" y1="298" x2="230" y2="320" stroke="#E8842A" stroke-width="3" marker-end="url(#d-aro)"/>
  <text x="238" y="318" font-size="12.5" font-weight="bold" fill="#B35C00">−Y</text>

  <rect x="48" y="330" width="364" height="24" rx="4" fill="#FFFFFF" stroke="#E8842A" stroke-width="1.2"/>
  <text x="230" y="347" font-size="12.5" font-weight="bold" fill="#B35C00" text-anchor="middle">1 tổ hợp gốc  →  × 4 combo phái sinh</text>

  <!-- ===== PANEL B ===== -->
  <rect x="452" y="74" width="420" height="290" rx="6" fill="#F2F6FA" stroke="#1F6FB2" stroke-width="1.5"/>
  <text x="472" y="100" font-size="14" font-weight="bold" fill="#12558F">B. Tổ hợp CÓ tải ngang (gió, động đất)</text>
  <text x="472" y="120" font-size="12" fill="#14314F">Chiều bất lợi đã biết: cùng chiều hợp lực ngang</text>

  <rect x="590" y="170" width="140" height="120" fill="#FFFFFF" stroke="#14314F" stroke-width="1.6"/>
  <text x="660" y="264" font-size="12" fill="#6B7A88" text-anchor="middle">MẶT BẰNG</text>
  <!-- Wx -->
  <line x1="520" y1="250" x2="582" y2="250" stroke="#1F6FB2" stroke-width="3" marker-end="url(#d-arb)"/>
  <text x="516" y="242" font-size="12.5" font-weight="bold" fill="#12558F" text-anchor="end">1.6 Wx</text>
  <!-- 0.5Wy -->
  <line x1="660" y1="162" x2="660" y2="132" stroke="#1F6FB2" stroke-width="3" marker-end="url(#d-arb)"/>
  <text x="670" y="142" font-size="12.5" font-weight="bold" fill="#12558F">0.8 Wy</text>
  <!-- resultant -->
  <line x1="586" y1="256" x2="700" y2="176" stroke="#6B7A88" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#d-arg)"/>
  <text x="704" y="172" font-size="11.5" fill="#6B7A88">hợp lực ngang</text>
  <!-- notional along resultant -->
  <line x1="540" y1="316" x2="640" y2="246" stroke="#E8842A" stroke-width="3.4" marker-end="url(#d-aro)"/>
  <text x="502" y="330" font-size="13" font-weight="bold" fill="#B35C00">Ni</text>

  <rect x="472" y="330" width="380" height="24" rx="4" fill="#FFFFFF" stroke="#1F6FB2" stroke-width="1.2"/>
  <text x="662" y="347" font-size="12.5" font-weight="bold" fill="#12558F" text-anchor="middle">1 tổ hợp gốc  →  × 1 combo (không nhân 4)</text>

  <rect x="28" y="378" width="844" height="40" rx="4" fill="#FFFFFF" stroke="#C0392B" stroke-width="1.3"/>
  <text x="44" y="395" font-size="12" fill="#14314F"><tspan font-weight="bold" fill="#C0392B">Giữ nguyên tỷ lệ và DẤU của tổ hợp: </tspan>1.6(Wx + 0.5Wy) → +1.6(Nx + 0.5Ny)   •   1.0(Vx − 0.3Vy) → +1.0(Nx − 0.3Ny)</text>
  <text x="44" y="411" font-size="12" fill="#14314F"><tspan font-weight="bold">Lối tắt §C2.2b(4): </tspan>nếu Δ bậc 2 / Δ bậc 1 ≤ 1.7 ở mọi tầng → chỉ cần đặt notional cho tổ hợp thuần tải đứng (Panel A), bỏ được toàn bộ Panel B.</text>
</svg>
