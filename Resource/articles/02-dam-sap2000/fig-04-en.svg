  <text
     x="82"
     y="266"
     font-size="15px"
     font-weight="bold"
     fill="#12558f"
     id="text10">STEP 2 — Set up the second-order analysis</text>
  <g
     font-size="12.5px"
     fill="#14314f"
     id="g14">
    <text
       x="82"
       y="290"
       id="text11">1 Define &gt; Load Combinations &gt; Convert Combos to Nonlinear Cases</text>
    <text
       x="82"
       y="311"
       id="text12">2 Verify each case: Nonlinear + P-Delta, Zero Initial, Full Load, Final State Only</text>
    <text
       x="82"
       y="332"
       id="text13">3 Erection / Operation mass conflict → set Mass Source = Empty for that case</text>
    <text
       x="82"
       y="353"
       fill="#c0392b"
       id="text14">Note: second-order results cannot be superposed — one nonlinear case per combination</text>
  </g>
  <line
     x1="390"
     y1="372"
     x2="390"
     y2="400"
     stroke="#1f6fb2"
     stroke-width="2"
