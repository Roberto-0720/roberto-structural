  <text
     x="82"
     y="428"
     font-size="15px"
     font-weight="bold"
     fill="#12558f"
     id="text15">STEP 3 — Stiffness reduction and K = 1.0</text>
  <g
     font-size="12.5px"
     fill="#14314f"
     id="g20">
    <text
       x="82"
       y="452"
       id="text16">1 Preferences: AISC 360-10 / LRFD / Analysis Method = Direct Analysis</text>
    <text
       x="82"
       y="473"
       id="text17">Second Order Method = General 2nd Order / Stiffness Reduction = Tau-b Variable</text>
    <text
       x="82"
       y="496"
       id="text18">2 Overwrites for all beam-columns: K1 = K2 = K(LTB) = 1.0</text>
    <text
       x="82"
       y="519"
       id="text19">3 Steel modifiers: EA = 0.8 ; EI = 0.8 τb</text>
    <text
       x="82"
       y="540"
       id="text20">4 RC modifiers (ACI 318 Table 6.6.3.1.1a): piers 0.70 Ig ; tie beams 0.35 Ig</text>
  </g>
