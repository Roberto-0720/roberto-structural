  <text
     x="82"
     y="104"
     font-size="15px"
     font-weight="bold"
     fill="#12558f"
     id="text4">STEP 1 — Define notional loads</text>
  <g
     font-size="12.5px"
     fill="#14314f"
     id="g8">
    <text
       x="82"
       y="128"
       id="text5">1 Finalise the full LRFD combination set (steel / RC / connections / base plates)</text>
    <text
       x="82"
       y="149"
       id="text6">2 List EVERY gravity pattern, create X/Y pairs: Type = NOTIONAL, SelfWtMult = 0, Ratio = 0.002</text>
    <text
       x="82"
       y="170"
       id="text7">3 Group each “repeated set” in brackets into one linear load case: NOx, NOPx, NLx, NLMx…</text>
    <text
       x="82"
       y="191"
       id="text8">4 Add to combos: 4 directions (gravity only) / along the resultant (with lateral load)</text>
  </g>
  <line
     x1="390"
     y1="210"
     x2="390"
     y2="238"
     stroke="#1f6fb2"
     stroke-width="2"
