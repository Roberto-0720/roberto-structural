       y="184"
       id="text23">1.0 (danh nghĩa)</text>
    <text
       x="672"
       y="184"
       font-size="11.5px"
       id="text24">AISC 360-10 §C2.3(3)</text>
    <text
       x="52"
       y="222"
       id="text25">THÉP — xoắn J, diện tích cắt</text>
    <text
       x="292"
       y="222"
       id="text26">1.0</text>
    <text
       x="482"
       y="222"
       id="text27">1.0</text>
    <text
       x="672"
       y="222"
       font-size="11.5px"
       id="text28">Không yêu cầu giảm</text>
