    <text
       x="672"
       y="146"
       font-size="11.5px"
       id="text20">AISC 360-10 §C2.3(2)</text>
    <text
       x="52"
       y="184"
       font-weight="bold"
       id="text21">THÉP — mômen quán tính (EI)</text>
