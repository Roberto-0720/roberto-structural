<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 62 780 790" width="780" height="790" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="f-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1F6FB2"/>
    </marker>
    <marker id="f-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#C0392B"/>
    </marker>
  </defs>
  <rect x="0" y="62" width="780" height="790" fill="#FFFFFF"/>

  
  

  <!-- STEP 1 -->
  <rect x="60" y="78" width="660" height="132" rx="7" fill="#F2F6FA" stroke="#1F6FB2" stroke-width="1.8"/>
  <rect x="60" y="78" width="8" height="132" fill="#1F6FB2"/>
  <text x="82" y="104" font-size="15" font-weight="bold" fill="#12558F">BƯỚC 1 — Khai báo Notional Load</text>
  <g font-size="12.5" fill="#14314F">
    <text x="82" y="128">1  Chốt toàn bộ bộ tổ hợp LRFD (Steel / RC / connection / base plate)</text>
    <text x="82" y="149">2  Lọc ĐỦ mọi load pattern tải đứng, tạo cặp X/Y: Type = NOTIONAL, SelfWtMult = 0, Ratio = 0.002</text>
    <text x="82" y="170">3  Gom “Repeated Set” trong ngoặc thành Load Case tuyến tính: NOx, NOPx, NLx, NLMx…</text>
    <text x="82" y="191">4  Cộng vào combo: 4 chiều (thuần tải đứng) / theo hợp lực (có tải ngang)</text>
  </g>
  <text x="700" y="200" font-size="11" fill="#6B7A88" text-anchor="end">Interactive Database Editing + Excel</text>
  <line x1="390" y1="210" x2="390" y2="238" stroke="#1F6FB2" stroke-width="2" marker-end="url(#f-ar)"/>

  <!-- STEP 2 -->
  <rect x="60" y="240" width="660" height="132" rx="7" fill="#F2F6FA" stroke="#1F6FB2" stroke-width="1.8"/>
  <rect x="60" y="240" width="8" height="132" fill="#1F6FB2"/>
  <text x="82" y="266" font-size="15" font-weight="bold" fill="#12558F">BƯỚC 2 — Thiết lập phân tích bậc hai</text>
  <g font-size="12.5" fill="#14314F">
    <text x="82" y="290">1  Define &gt; Load Combinations &gt; Convert Combos to Nonlinear Cases</text>
    <text x="82" y="311">2  Kiểm từng case: Nonlinear + P-Delta, Zero Initial, Full Load, Final State Only</text>
    <text x="82" y="332">3  Xung đột mass Erection / Operation → đặt Mass Source = Empty cho case đó</text>
    <text x="82" y="353" fill="#C0392B">Lưu ý: phân tích bậc hai KHÔNG cộng tác dụng được — mỗi combo là một case riêng</text>
  </g>
  <line x1="390" y1="372" x2="390" y2="400" stroke="#1F6FB2" stroke-width="2" marker-end="url(#f-ar)"/>

  <!-- STEP 3 -->
  <rect x="60" y="402" width="660" height="152" rx="7" fill="#F2F6FA" stroke="#1F6FB2" stroke-width="1.8"/>
  <rect x="60" y="402" width="8" height="152" fill="#1F6FB2"/>
  <text x="82" y="428" font-size="15" font-weight="bold" fill="#12558F">BƯỚC 3 — Suy giảm độ cứng và K = 1.0</text>
  <g font-size="12.5" fill="#14314F">
    <text x="82" y="452">1  Preferences: AISC 360-10 / LRFD / Analysis Method = Direct Analysis</text>
    <text x="82" y="473">    Second Order Method = General 2nd Order / Stiffness Reduction = Tau-b Variable</text>
    <text x="82" y="496">2  Overwrites cho mọi beam-column: K1 = K2 = K(LTB) = 1.0</text>
    <text x="82" y="519">3  Modifier thép: EA = 0.8 ; EI = 0.8 τb</text>
    <text x="82" y="540">4  Modifier RC (ACI 318 Bảng 6.6.3.1.1a): trụ 0.70 Ig ; dầm giằng 0.35 Ig</text>
  </g>
  <line x1="390" y1="554" x2="390" y2="582" stroke="#1F6FB2" stroke-width="2" marker-end="url(#f-ar)"/>

  <!-- STEP 4 -->
  <rect x="60" y="584" width="660" height="150" rx="7" fill="#F2F6FA" stroke="#1F6FB2" stroke-width="1.8"/>
  <rect x="60" y="584" width="8" height="150" fill="#1F6FB2"/>
  <text x="82" y="610" font-size="15" font-weight="bold" fill="#12558F">BƯỚC 4 — Analyze &amp; Design HAI LẦN</text>

  <g stroke="#14314F" stroke-width="1.4" fill="#FFFFFF">
    <rect x="86" y="628" width="128" height="46" rx="5"/>
    <rect x="242" y="628" width="128" height="46" rx="5"/>
    <rect x="398" y="628" width="128" height="46" rx="5"/>
    <rect x="554" y="628" width="140" height="46" rx="5"/>
  </g>
  <g font-size="12" fill="#14314F" text-anchor="middle">
    <text x="150" y="648" font-weight="bold">1st Analysis</text>
    <text x="150" y="665" font-size="10.5" fill="#6B7A88">lấy Pu</text>
    <text x="306" y="648" font-weight="bold">1st Design</text>
    <text x="306" y="665" font-size="10.5" fill="#6B7A88">xuất τb yêu cầu</text>
    <text x="462" y="648" font-weight="bold">2nd Analysis</text>
    <text x="462" y="665" font-size="10.5" fill="#6B7A88">đã gán EA/EI</text>
    <text x="624" y="648" font-weight="bold">2nd Design</text>
    <text x="624" y="665" font-size="10.5" fill="#6B7A88">D/C hợp lệ</text>
  </g>
  <g stroke="#1F6FB2" stroke-width="1.8" fill="none">
    <line x1="214" y1="651" x2="238" y2="651" marker-end="url(#f-ar)"/>
    <line x1="370" y1="651" x2="394" y2="651" marker-end="url(#f-ar)"/>
    <line x1="526" y1="651" x2="550" y2="651" marker-end="url(#f-ar)"/>
  </g>
  <path d="M 306 674 L 306 700 L 462 700 L 462 678" fill="none" stroke="#C0392B" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#f-arr)"/>
  <text x="384" y="716" font-size="11" fill="#C0392B" text-anchor="middle">gán lại modifier EI = 0.8 τb — lặp thêm nếu τb đổi &gt; 5%</text>

  <!-- SHORTCUT -->
  <rect x="60" y="756" width="660" height="80" rx="7" fill="#FDF2E6" stroke="#E8842A" stroke-width="1.8"/>
  <text x="82" y="782" font-size="14" font-weight="bold" fill="#B35C00">LỐI TẮT KHUYẾN NGHỊ (AISC 360-10 §C2.3(3)) — chỉ chạy MỘT vòng</text>
  <g font-size="12.5" fill="#14314F">
    <text x="82" y="804">Ratio notional = 0.003 (thay 0.002)  +  Tau-b Fixed = 1.0  →  EA = EI = 0.8 cố định cho mọi cấu kiện thép</text>
    <text x="82" y="824" fill="#6B7A88">Xoá bỏ vòng lặp τb, giảm một nửa số lần chạy, hồ sơ tính đơn giản hơn</text>
      <text x="82" y="842" fill="#6B7A88">— chi phí thép tăng không đáng kể</text>
  </g>

  
</svg>
