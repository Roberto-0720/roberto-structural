  <text
     x="82"
     y="104"
     font-size="15px"
     font-weight="bold"
     fill="#12558f"
     id="text4">BƯỚC 1 — Khai báo Notional Load</text>
  <g
     font-size="12.5px"
     fill="#14314f"
     id="g8">
    <text
       x="82"
       y="128"
       id="text5">1 Chốt toàn bộ bộ tổ hợp LRFD (Steel / RC / connection / base plate)</text>
    <text
       x="82"
       y="149"
       id="text6">2 Lọc ĐỦ mọi load pattern tải đứng, tạo cặp X/Y: Type = NOTIONAL, SelfWtMult = 0, Ratio = 0.002</text>
    <text
       x="82"
       y="170"
       id="text7">3 Gom “Repeated Set” trong ngoặc thành Load Case tuyến tính: NOx, NOPx, NLx, NLMx…</text>
    <text
       x="82"
       y="191"
       id="text8">4 Cộng vào combo: 4 chiều (thuần tải đứng) / theo hợp lực (có tải ngang)</text>
  </g>
  <line
     x1="390"
     y1="210"
     x2="390"
     y2="238"
