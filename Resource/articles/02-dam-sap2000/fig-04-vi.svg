     font-weight="bold"
     fill="#12558f"
     id="text10">BƯỚC 2 — Thiết lập phân tích bậc hai</text>
  <g
     font-size="12.5px"
     fill="#14314f"
     id="g14">
    <text
       x="82"
       y="290"
       id="text11">1 Define &gt; Load Combinations &gt; Convert Combos to Nonlinear Cases</text>
    <text
       x="82"
       y="311"
       id="text12">2 Kiểm từng case: Nonlinear + P-Delta, Zero Initial, Full Load, Final State Only</text>
    <text
       x="82"
       y="332"
       id="text13">3 Xung đột mass Erection / Operation → đặt Mass Source = Empty cho case đó</text>
    <text
       x="82"
       y="353"
       fill="#c0392b"
       id="text14">Lưu ý: phân tích bậc hai KHÔNG cộng tác dụng được — mỗi combo là một case riêng</text>
  </g>
